# =============================================================================
# AMR-X  -  ros_gz_bridge configuration  (Gazebo FORTRESS / ROS 2 Humble)
# =============================================================================
# Maps Ignition Transport topics <-> ROS 2 topics.
# Used by the parameter_bridge: it is loaded via the `config_file` parameter.
#
# Fortress message types use the "ignition.msgs.*" prefix.
# (On Harmonic these become "gz.msgs.*".)
#
# direction:  GZ_TO_ROS | ROS_TO_GZ | BIDIRECTIONAL
# =============================================================================

# ---- Simulation clock (Gazebo -> ROS). REQUIRED for use_sim_time. ----------
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

# ---- Velocity command (ROS -> Gazebo) : teleop / Nav2 drive the robot ------
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "ignition.msgs.Twist"
  direction: ROS_TO_GZ

# ---- Odometry (Gazebo -> ROS) : simulated wheel-encoder odometry -----------
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS

# ---- Odometry TF (Gazebo -> ROS) : odom -> base_footprint transform --------
- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS

# ---- Joint states (Gazebo -> ROS) : wheel positions/velocities -------------
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS

# ---- LiDAR scan (Gazebo -> ROS) --------------------------------------------
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "ignition.msgs.LaserScan"
  direction: GZ_TO_ROS

# ---- IMU (Gazebo -> ROS) ---------------------------------------------------
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: GZ_TO_ROS
